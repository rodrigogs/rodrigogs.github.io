name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily refresh of GitHub, npm and crates.io numbers (03:17 in UTC-3).
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch live numbers
        run: node scripts/fetch-data.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed snapshot
        # Timestamps change on every run; commit only when a number changed.
        run: |
          if git diff --quiet -I '"(fetchedAt|lastSuccessAt)"' -- src/data/snapshot.json; then
            echo "No data changes; building with fresh timestamps only."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/snapshot.json
            git commit -m "chore(data): refresh snapshot"
            git push
          fi

      - run: npm test

      - run: npm run build
        env:
          GIT_SHA: ${{ github.sha }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
